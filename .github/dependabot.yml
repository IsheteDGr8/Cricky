version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Expo SDK packages must move together; upgrade them with `npx expo install --fix`.
      expo:
        patterns:
          ['expo', 'expo-*', '@expo/*', 'react', 'react-dom', 'react-native', 'react-native-*']
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
